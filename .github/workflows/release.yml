name: Release

on:
  push:
    branches: [main]
  # Builds the installers of a release again, when a build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to build again, for example v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Only when a release was just made, or when asked by hand.
  bundle:
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.created == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/bundle.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag }}

  # The only job allowed to write: it runs no code of the repository.
  publish:
    needs: [release-please, bundle]
    if: always() && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: out
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: |
          (cd out && sha256sum -- * > SHA256SUMS.txt)
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
